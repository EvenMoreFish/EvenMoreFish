name: WatchWolf Paper smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Start WatchWolf managers
        run: docker compose -f watchwolf/compose.yaml up --wait -d
      - name: Run Paper smoke test
        run: ./gradlew :even-more-fish-plugin:testWatchWolf
      - name: Save manager logs
        if: always()
        run: docker compose -f watchwolf/compose.yaml logs --no-color > watchwolf-managers.log
      - name: Upload test reports and manager logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchwolf-paper-smoke
          retention-days: 14
          if-no-files-found: warn
          path: |
            even-more-fish-plugin/build/reports/tests/testWatchWolf/
            even-more-fish-plugin/build/test-results/testWatchWolf/
            watchwolf-managers.log
      - name: Stop WatchWolf managers
        if: always()
        run: docker compose -f watchwolf/compose.yaml down -v
